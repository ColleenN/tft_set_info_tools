# Builds the snapshot loader image and pushes it to a Docker registry in
# Artifact Registry. Tests run first, so a failing test stops the push.
#
# _REGION and _REGISTRY have no defaults here; the Cloud Build trigger
# supplies them (tft_data_infra's image builds do). For a manual build:
#   gcloud builds submit --substitutions=_REGION=...,_REGISTRY=...,SHORT_SHA=...

substitutions:
  _IMAGE: tft-set-info-tools

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: sh
    args:
      - -c
      - pip install --quiet ".[dev,gcp]" && pytest

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:latest
      - .

# Pushed only if every step succeeds.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/${_IMAGE}:latest
