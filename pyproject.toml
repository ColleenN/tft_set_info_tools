[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tft_set_info_tools"
version = "0.2.2"
description = "Shared tools for working with TFT set info across my Python projects."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Colleen Nelson", email = "colleenfnelson@gmail.com" },
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
tft-scripts = "tft_set_info_tools.scripts.cli:main"

[project.optional-dependencies]
gcp = [
    "google-cloud-storage>=2",
    "google-cloud-bigquery>=3",
]
unreal = [
    "cryptography>=42",
    "pyooz>=0.0.8",
]
all = [
    "tft_set_info_tools[gcp,unreal]",
]
dev = [
    "tft_set_info_tools[unreal]",
    "pytest>=8",
    "build>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tft_set_info_tools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
